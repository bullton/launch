<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ROCKET · 数据后台</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/admin.css" />
</head>
<body class="adm-body">
  <header class="adm-head">
    <div class="adm-head-in">
      <a class="brand" href="/" aria-label="返回发射控制台">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-text">ROCKET</span>
        <span class="brand-sub">ADMIN · 数据后台</span>
      </a>
      <div class="adm-head-actions">
        <span id="admGuard" class="adm-guard">—</span>
        <label class="adm-switch">
          <input id="autoRefresh" type="checkbox" checked />
          <span>自动刷新 5s</span>
        </label>
        <button id="refreshBtn" class="adm-btn primary" type="button">刷新</button>
        <a class="adm-btn" href="/">返回控制台</a>
      </div>
    </div>
  </header>

  <main class="adm-main">
    <div id="admBanner" class="adm-banner" hidden></div>

    <section id="admStats" class="adm-stats" aria-label="运行状态">
      <div class="adm-stat"><div class="k">数据库 · DB</div><div class="v">—</div></div>
      <div class="adm-stat"><div class="k">最近获取 · LAST FETCH</div><div class="v">—</div></div>
      <div class="adm-stat"><div class="k">上游状态 · UPSTREAM</div><div class="v">—</div></div>
      <div class="adm-stat"><div class="k">服务进程 · PROCESS</div><div class="v">—</div></div>
      <div class="adm-stat"><div class="k">版本 · BUILD</div><div class="v">—</div></div>
    </section>

    <section class="adm-panel">
      <div class="adm-panel-head">
        <h2>日志 · LOGS <span id="admLogCount" class="adm-count"></span></h2>
        <div class="adm-tools">
          <div class="adm-chips" role="group" aria-label="日志类型筛选">
            <button type="button" data-kind="all" class="on">全部</button>
            <button type="button" data-kind="api">API 获取</button>
            <button type="button" data-kind="notam">NOTAM</button>
            <button type="button" data-kind="server">服务</button>
          </div>
          <label class="adm-fail">
            <input id="onlyFail" type="checkbox" />
            <span>仅失败</span>
          </label>
          <input id="logSearch" class="adm-search" type="search" placeholder="搜索关键字…" aria-label="搜索日志关键字" autocomplete="off" />
        </div>
      </div>
      <div class="adm-table-wrap">
        <table class="adm-table">
          <thead>
            <tr>
              <th class="c-time">时间</th>
              <th class="c-kind">类型</th>
              <th>内容</th>
              <th class="c-dur">耗时</th>
              <th class="c-status">状态</th>
            </tr>
          </thead>
          <tbody id="admLogBody">
            <tr><td colspan="5" class="adm-empty">加载中…</td></tr>
          </tbody>
        </table>
      </div>
    </section>

    <section class="adm-panel">
      <div class="adm-panel-head">
        <h2>NOTAM 落区档案 · DROP ZONES <span id="admNotamCount" class="adm-count"></span></h2>
        <span class="adm-hint">永久归档：首次反解出方位角后不再被空结果覆盖</span>
      </div>
      <div class="adm-table-wrap">
        <table class="adm-table">
          <thead>
            <tr>
              <th class="c-time">时间</th>
              <th>任务</th>
              <th class="c-status">结果</th>
              <th class="c-num">方位角</th>
              <th class="c-num">反解倾角</th>
              <th class="c-num">落区</th>
            </tr>
          </thead>
          <tbody id="admNotamBody">
            <tr><td colspan="6" class="adm-empty">加载中…</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <footer class="adm-foot">
    <span>ROCKET LAUNCH CONSOLE · ADMIN</span>
    <span id="admClock">—</span>
  </footer>

  <script src="/admin.js"></script>
</body>
</html>
